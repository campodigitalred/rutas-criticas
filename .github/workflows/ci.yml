name: CI

# Ejecuta las pruebas y validaciones en cada push y en los pull requests.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancela ejecuciones anteriores del mismo ref si llega un nuevo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check app

      - name: Smoke test — importar la API (valida el cableado FastAPI)
        run: python -c "import app.main; print('app.main importado correctamente')"

      - name: Pruebas (pytest)
        run: pytest -v

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Formato (prettier) — informativo
        run: npx prettier --check "src/**/*.{js,jsx}" || true

      - name: Construir (vite build)
        run: npm run build
