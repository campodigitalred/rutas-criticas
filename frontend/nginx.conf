server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de activos estáticos.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy de la API al servicio backend (misma-origen → sin CORS).
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Healthcheck del backend (opcional, útil para diagnósticos).
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # SPA: cualquier ruta desconocida devuelve index.html (React Router del lado cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cacheo agresivo de activos con hash de Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
